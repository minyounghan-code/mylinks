<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>링크 모음</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --sub: #6b7280;
    --accent: #ff5a3c; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101216; --card: #1a1e24; --text: #f3f4f6; --sub: #9ca3af; --border: #2a2f37; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", -apple-system, sans-serif;
    min-height: 100vh; padding: 40px 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  .avatar {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 38px;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .bio { color: var(--sub); font-size: 14px; }
  .link-card {
    display: block; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 12px;
    text-decoration: none; color: var(--text);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .link-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  .link-card .title { font-weight: 700; font-size: 16px; }
  .link-card .note { color: var(--sub); font-size: 13px; margin-top: 4px; }
  .link-card .cta {
    display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600;
    color: var(--accent);
  }
  footer { text-align: center; color: var(--sub); font-size: 11.5px; margin-top: 32px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar">🛒</div>
    <h1 id="name"></h1>
    <p class="bio" id="bio"></p>
  </header>
  <main id="links"></main>
  <footer id="disclosure"></footer>
</div>
<script>
fetch('links.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    document.getElementById('name').textContent = data.profile.name;
    document.getElementById('bio').textContent = data.profile.bio;
    document.getElementById('disclosure').textContent = data.profile.disclosure;
    document.title = data.profile.name;
    const main = document.getElementById('links');
    for (const l of data.links) {
      const a = document.createElement('a');
      a.className = 'link-card';
      a.href = l.url; a.target = '_blank'; a.rel = 'noopener sponsored';
      a.innerHTML = '<div class="title"></div>' +
                    (l.note ? '<div class="note"></div>' : '') +
                    '<span class="cta">최저가 보러가기 →</span>';
      a.querySelector('.title').textContent = l.title;
      if (l.note) a.querySelector('.note').textContent = l.note;
      main.appendChild(a);
    }
  });
</script>
</body>
</html>
